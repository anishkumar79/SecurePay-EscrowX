name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. CI Validation for Smart Contract
  ci-contract:
    name: Build and Test Smart Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Run smart contract tests
        run: |
          cd contract
          cargo test

      - name: Build smart contract (WASM)
        run: |
          cd contract
          cargo build --target wasm32v1-none --release

      - name: Upload compiled contract WASM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: escrowx_contract.wasm
          path: contract/target/wasm32v1-none/release/escrowx_contract.wasm

  # 2. CI Validation for Frontend
  ci-frontend:
    name: Build and Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # 3. CD Validation for Smart Contract and Frontend (Deployment)
  cd-deploy:
    name: Continuous Deployment
    needs: [ci-contract, ci-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled contract WASM
        uses: actions/download-artifact@v4
        with:
          name: escrowx_contract.wasm
          path: contract/target/wasm32v1-none/release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend for Production
        run: |
          cd frontend
          npm run build
        env:
          VITE_STELLAR_NETWORK: testnet
          VITE_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org:443
          VITE_CONTRACT_ADDRESS: CBGL7N5GANUBPAV2UHXC5UBW3JSXGNLAKOMVJD54YNIZF6WN6PHSMQAL

      # Deploy Frontend to Vercel (non-blocking if secrets are not set)
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

      # Confirm smart contract already deployed to Stellar Testnet
      - name: Confirm Smart Contract Deployment
        run: |
          echo "Smart contract deployed at: CBGL7N5GANUBPAV2UHXC5UBW3JSXGNLAKOMVJD54YNIZF6WN6PHSMQAL"
          echo "Network: Stellar Testnet"
          echo "Explorer: https://stellar.expert/explorer/testnet/contract/CBGL7N5GANUBPAV2UHXC5UBW3JSXGNLAKOMVJD54YNIZF6WN6PHSMQAL"
